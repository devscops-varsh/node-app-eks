name: minikube selfhosted runner
on:
  push:
    branches:
    - main

concurrency:
  group: minikube-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: devscops-varsh/backend-app

jobs:
  docker-build:
    runs-on: self-minikube
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha
          type=raw,value=dev

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./minikube/app
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: docker-build
    runs-on: self-minikube
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify cluster is reachable
      run: kubectl cluster-info

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f minikube/app/service-files/app-deployment.yml -n node-app

    - name: Roll out new image
      run: |
        kubectl set image deployment/backend-app \
          backend-app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev \
          -n node-app

    - name: Wait for rollout to complete
      run: kubectl rollout status deployment/backend-app -n node-app --timeout=120s
